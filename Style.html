<style>
  :root {
    --bg-base: #14181f;
    --bg-surface: #1c222c;
    --bg-surface-2: #232a36;
    --bg-elevated: #2a3240;
    --border-subtle: #333d4d;
    --border-strong: #47536566;

    --text-primary: #e9edf3;
    --text-secondary: #a6b0c0;
    --text-muted: #6b7787;

    --accent: #5b8def;
    --accent-strong: #3f6fd6;
    --accent-soft: #5b8def22;

    --success: #3ecf8e;
    --success-soft: #3ecf8e1f;
    --danger: #f2626b;
    --danger-soft: #f2626b1f;
    --warning: #f2a94e;
    --warning-soft: #f2a94e1f;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-pill: 999px;

    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.35);
    --shadow-pop: 0 8px 28px rgba(0, 0, 0, 0.45);

    --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    background-color: var(--bg-base);
    color: var(--text-primary);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans",
      "Noto Sans JP", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a {
    color: var(--accent);
  }

  .app-shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px 48px;
  }

  /* ---------- ヘッダー ---------- */
  .app-header {
    background: linear-gradient(180deg, var(--bg-surface) 0%, var(--bg-base) 100%);
    border-bottom: 1px solid var(--border-subtle);
    padding: 22px 16px 18px;
    margin-bottom: 24px;
  }

  .app-header-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .app-title {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .app-title .bi {
    color: var(--accent);
  }

  .app-nav {
    display: flex;
    gap: 6px;
  }

  .app-nav a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: var(--radius-pill);
    color: var(--text-secondary);
    text-decoration: none;
    transition: background var(--transition), color var(--transition);
    font-size: 1.05rem;
  }

  .app-nav a:hover,
  .app-nav a.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ---------- カード ---------- */
  .card {
    background-color: var(--bg-surface) !important;
    border: 1px solid var(--border-subtle) !important;
    border-radius: var(--radius-lg) !important;
    box-shadow: var(--shadow-card);
    color: var(--text-primary);
  }

  .card-header {
    background-color: var(--bg-surface-2) !important;
    border-bottom: 1px solid var(--border-subtle) !important;
    color: var(--text-primary);
    font-weight: 600;
    border-top-left-radius: var(--radius-lg) !important;
    border-top-right-radius: var(--radius-lg) !important;
  }

  .card-title {
    color: var(--text-primary);
    font-weight: 700;
  }

  /* ---------- フォーム部品 ---------- */
  .form-select,
  .form-control {
    background-color: var(--bg-elevated) !important;
    border: 1px solid var(--border-subtle) !important;
    color: var(--text-primary) !important;
    border-radius: var(--radius-sm) !important;
  }

  .form-select:focus,
  .form-control:focus {
    border-color: var(--accent) !important;
    box-shadow: 0 0 0 3px var(--accent-soft) !important;
  }

  .form-label {
    color: var(--text-secondary);
    font-weight: 500;
    font-size: 0.88rem;
  }

  .form-select option {
    background-color: var(--bg-elevated);
    color: var(--text-primary);
  }

  /* ---------- ボタン ---------- */
  .btn {
    border-radius: var(--radius-sm);
    font-weight: 600;
    transition: transform var(--transition), box-shadow var(--transition),
      background var(--transition), border-color var(--transition);
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background-color: var(--accent) !important;
    border-color: var(--accent) !important;
  }

  .btn-primary:hover {
    background-color: var(--accent-strong) !important;
    border-color: var(--accent-strong) !important;
    box-shadow: 0 4px 14px var(--accent-soft);
  }

  .btn-secondary {
    background-color: var(--bg-elevated) !important;
    border-color: var(--border-subtle) !important;
    color: var(--text-primary) !important;
  }

  .btn-secondary:hover {
    background-color: var(--bg-surface-2) !important;
  }

  .btn-success {
    background-color: var(--success) !important;
    border-color: var(--success) !important;
    color: #0c2018 !important;
  }

  .btn-outline-primary {
    color: var(--accent) !important;
    border-color: var(--accent) !important;
  }

  .btn-outline-primary:hover {
    background-color: var(--accent) !important;
    color: #fff !important;
  }

  .btn-outline-secondary {
    color: var(--text-secondary) !important;
    border-color: var(--border-subtle) !important;
  }

  .btn-outline-secondary:hover {
    background-color: var(--bg-elevated) !important;
    color: var(--text-primary) !important;
  }

  /* ---------- 正誤ボタン（丸ボタン） ---------- */
  .answer-btn {
    width: 84px;
    height: 84px;
    font-weight: 700;
    border-width: 2px !important;
  }

  .answer-btn.btn-outline-primary {
    color: var(--accent) !important;
    border-color: var(--accent) !important;
  }

  .answer-btn.btn-outline-danger {
    color: var(--danger) !important;
    border-color: var(--danger) !important;
  }

  .answer-btn.btn-outline-primary:hover {
    background-color: var(--accent) !important;
    box-shadow: 0 0 0 6px var(--accent-soft);
  }

  .answer-btn.btn-outline-danger:hover {
    background-color: var(--danger) !important;
    box-shadow: 0 0 0 6px var(--danger-soft);
  }

  /* ---------- 出題カード ---------- */
  .card-question {
    min-height: 160px;
    font-size: 1.08rem;
    line-height: 1.65;
    color: var(--text-primary);
  }

  .badge.bg-info {
    background-color: var(--accent-soft) !important;
    color: var(--accent) !important;
    font-weight: 600;
    border-radius: var(--radius-pill);
    padding: 6px 12px;
  }

  .badge.bg-secondary {
    background-color: var(--bg-elevated) !important;
    color: var(--text-secondary) !important;
    font-weight: 600;
    border-radius: var(--radius-pill);
    padding: 5px 10px;
  }

  .badge.bg-danger {
    background-color: var(--danger-soft) !important;
    color: var(--danger) !important;
    font-weight: 700;
    border-radius: var(--radius-pill);
  }

  /* ---------- 正誤フィードバック ---------- */
  .alert {
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    animation: pop-in 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes pop-in {
    from {
      opacity: 0;
      transform: translateY(6px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .alert-success {
    background-color: var(--success-soft) !important;
    border-color: var(--success) !important;
    color: var(--success) !important;
  }

  .alert-success .alert-heading {
    color: var(--success);
  }

  .alert-danger {
    background-color: var(--danger-soft) !important;
    border-color: var(--danger) !important;
    color: var(--danger) !important;
  }

  .alert-danger .alert-heading {
    color: var(--danger);
  }

  .alert-info {
    background-color: var(--accent-soft) !important;
    border-color: var(--accent) !important;
    color: var(--text-primary) !important;
  }

  .alert-warning {
    background-color: var(--warning-soft) !important;
    border-color: var(--warning) !important;
    color: var(--warning) !important;
  }

  .alert p,
  .alert .text-muted {
    color: var(--text-secondary) !important;
  }

  .alert hr {
    border-color: currentColor;
    opacity: 0.25;
  }

  /* ---------- テーブル ---------- */
  .table {
    color: var(--text-primary);
    --bs-table-bg: transparent;
  }

  .table-bordered {
    border-color: var(--border-subtle);
  }

  .table > :not(caption) > * > * {
    background-color: transparent;
    border-color: var(--border-subtle);
    color: var(--text-primary);
  }

  .table thead th {
    color: var(--text-secondary);
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    border-bottom-width: 1px;
  }

  /* ---------- アコーディオン（検索・ブックマーク） ---------- */
  .accordion-item {
    background-color: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-md) !important;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .accordion-button {
    background-color: var(--bg-surface) !important;
    color: var(--text-primary) !important;
    font-weight: 500;
    box-shadow: none !important;
  }

  .accordion-button::after {
    filter: invert(1) grayscale(1) brightness(1.6);
  }

  .accordion-button:not(.collapsed) {
    background-color: var(--bg-surface-2) !important;
    color: var(--text-primary) !important;
  }

  .accordion-body {
    background-color: var(--bg-surface);
    color: var(--text-secondary);
    border-top: 1px solid var(--border-subtle);
  }

  .accordion-body strong {
    color: var(--text-primary);
  }

  /* ---------- トースト ---------- */
  .toast {
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-pop);
    border: none !important;
  }

  /* ---------- スピナー ---------- */
  .spinner-border {
    color: var(--accent);
  }

  /* ---------- リストグループ（苦手問題など） ---------- */
  .list-group-item {
    background-color: var(--bg-surface) !important;
    border-color: var(--border-subtle) !important;
    color: var(--text-primary) !important;
    border-radius: var(--radius-md) !important;
    margin-bottom: 10px;
  }

  .text-muted {
    color: var(--text-muted) !important;
  }

  /* ---------- フッターリンクエリア ---------- */
  .footer-actions {
    margin-top: 8px;
  }

  ::selection {
    background: var(--accent-soft);
  }

  /* スクロールバー（webkit） */
  ::-webkit-scrollbar {
    width: 10px;
    height: 10px;
  }
  ::-webkit-scrollbar-track {
    background: var(--bg-base);
  }
  ::-webkit-scrollbar-thumb {
    background: var(--bg-elevated);
    border-radius: var(--radius-pill);
  }
</style>
