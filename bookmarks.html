<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><?= pageTitle ?></title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <?!= include('Style', {}); ?>
  </head>
  <body>
    <?!= include('Header', {url: url, activePage: activePage, pageTitle: pageTitle}); ?>

    <main class="app-shell">
      <div class="text-center mb-4 footer-actions">
        <a href="<?= url ?>" class="btn btn-secondary">
          <i class="bi bi-arrow-left"></i> 問題集へ戻る
        </a>
      </div>

      <div id="loading" class="text-center py-4">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="text-secondary mt-2">ブックマークを読み込んでいます…</p>
      </div>

      <div id="bookmark-list" class="accordion"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      window.onload = function () {
        google.script.run
          .withSuccessHandler(displayBookmarks)
          .withFailureHandler(displayError)
          .getAllBookmarkedQuestionsForUser();
      };

      function displayError(error) {
        document.getElementById("loading").style.display = "none";
        document.getElementById(
          "bookmark-list"
        ).innerHTML = `<div class="alert alert-danger">読み込みに失敗しました：${error.message}</div>`;
      }

      function displayBookmarks(bookmarks) {
        document.getElementById("loading").style.display = "none";
        const list = document.getElementById("bookmark-list");

        if (!bookmarks || bookmarks.length === 0) {
          list.innerHTML =
            '<div class="alert alert-info">ブックマークされた問題はありません。</div>';
          return;
        }

        let html = "";
        bookmarks.forEach((item, index) => {
          const uniqueId = "item-" + index;
          html += `
          <div class="accordion-item" id="accordion-item-${uniqueId}">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${uniqueId}">
                <span class="badge bg-secondary me-2">${item.sheetName}</span>
                ${item.question}
              </button>
            </h2>
            <div id="collapse-${uniqueId}" class="accordion-collapse collapse" data-bs-parent="#bookmark-list">
              <div class="accordion-body">
                <p><strong>正解： ${item.answer}</strong></p>
                <p><strong>解説：</strong><br>${item.commentary}</p>
                <p class="text-muted small">根拠条文： ${
                  item.article || "（なし）"
                }</p>
                <hr>
                <div class="text-end">
                  <button class="btn btn-sm btn-danger" onclick="removeBookmark(this, '${item.sheetName}', ${item.rowNum}, 'accordion-item-${uniqueId}')">
                    <i class="bi bi-trash-fill"></i> このブックマークを削除
                  </button>
                </div>
              </div>
            </div>
          </div>`;
        });
        list.innerHTML = html;
      }

      function removeBookmark(button, sheetName, rowNum, elementId) {
        button.disabled = true;
        button.innerHTML =
          '<span class="spinner-border spinner-border-sm"></span> 削除中...';

        google.script.run
          .withSuccessHandler((result) => {
            if (result === "Removed") {
              const itemToRemove = document.getElementById(elementId);
              if (itemToRemove) {
                itemToRemove.remove();
              }
              const list = document.getElementById("bookmark-list");
              if (!list.querySelector(".accordion-item")) {
                list.innerHTML =
                  '<div class="alert alert-info">ブックマークされた問題はありません。</div>';
              }
            } else {
              alert("削除に失敗しました。");
              button.disabled = false;
              button.innerHTML =
                '<i class="bi bi-trash-fill"></i> このブックマークを削除';
            }
          })
          .withFailureHandler(() => {
            alert("削除に失敗しました。");
            button.disabled = false;
            button.innerHTML =
              '<i class="bi bi-trash-fill"></i> このブックマークを削除';
          })
          .removeBookmark(sheetName, rowNum);
      }
    </script>
  </body>
</html>
